# Relay for online play; deployed by .github/workflows/relay.yml. See relay/README.md.
name = "mini-games-relay"
main = "js/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# Pages origin plus `npx http-server .` for local development against the deployed relay.
ALLOWED_ORIGINS = "https://almang45.github.io,http://localhost:8080,http://127.0.0.1:8080"

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed, which is what the Workers Free plan offers.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Per client IP. Creating a room is rare; connects include every reconnect of a flaky phone.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
