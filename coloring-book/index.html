<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Buku Mewarnai</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<script src="../shared/register-sw.js" defer></script>
<link rel="stylesheet" href="../shared/kids/kids.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back-link" href="../index.html" data-i18n="back">← Semua Game</a>
    <h1 data-i18n="title">Buku Mewarnai</h1>
    <div class="toggles">
      <div class="lang" role="group" data-i18n-label="language">
        <button type="button" class="lang-btn" data-lang="id" aria-pressed="true">ID</button>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="icon-btn" id="btnSound" aria-pressed="true" data-i18n-label="sound">
        <span aria-hidden="true" id="soundIcon">🔊</span>
      </button>
    </div>
  </header>

  <nav class="pages" id="pages" data-i18n-label="pictures"></nav>

  <main class="easel" id="easel">
    <svg class="picture" id="picture" xmlns="http://www.w3.org/2000/svg" role="img"></svg>
  </main>

  <div class="actions" id="actions">
    <button type="button" class="action" id="btnUndo" data-i18n-label="undoLabel">
      <span aria-hidden="true">↶</span> <span data-i18n="undo">Ups</span>
    </button>
    <button type="button" class="action" id="btnClear" data-i18n-label="clearLabel">
      <span aria-hidden="true">🧽</span> <span data-i18n="clear">Hapus</span>
    </button>
    <button type="button" class="action" id="btnSave" data-i18n-label="saveLabel">
      <span aria-hidden="true">💾</span> <span data-i18n="save">Simpan</span>
    </button>
  </div>

  <div class="crayons" id="crayons" role="radiogroup" data-i18n-label="crayons"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="../shared/kids/kids.js"></script>
<script src="../color-fusion/js/mix.js"></script>
<script src="js/pictures.js"></script>
<script src="js/book.js"></script>
<script src="js/app.js"></script>
</body>
</html>
