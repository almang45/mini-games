  <path d="M31 46 V30 H69 V54" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M31 46 V30 H69 V54" fill="none" stroke="#ffd166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corner glow nodes -->
  <circle cx="31" cy="30" r="2.5" fill="#fff"/>
  <circle cx="69" cy="30" r="2.5" fill="#fff"/>
