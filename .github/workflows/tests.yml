name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # New games are picked up automatically as long as their tests live in <game>/js/test/.
      - name: Run every game's Node tests
        run: |
          for f in */js/test/*.test.js; do
            echo "::group::$f"
            node "$f" || exit 1
            echo "::endgroup::"
          done
