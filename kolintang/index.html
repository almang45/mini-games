<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Kolintang Warna</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<script src="../shared/register-sw.js" defer></script>
<link rel="stylesheet" href="../shared/kids/kids.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back-link" href="../index.html" data-i18n="back">← Semua Game</a>
    <h1 data-i18n="title">Kolintang Warna</h1>
    <div class="toggles">
      <div class="lang" role="group" data-i18n-label="language">
        <button type="button" class="lang-btn" data-lang="id" aria-pressed="true">ID</button>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="icon-btn" id="btnSound" aria-pressed="true" data-i18n-label="sound">
        <span aria-hidden="true" id="soundIcon">🔊</span>
      </button>
    </div>
  </header>

  <nav class="modes" role="tablist" data-i18n-label="modes">
    <button type="button" role="tab" class="mode" data-mode="free" aria-selected="true" aria-controls="stage">
      <span aria-hidden="true">🎵</span> <span data-i18n="modeFree">Bebas</span>
    </button>
    <button type="button" role="tab" class="mode" data-mode="songs" aria-selected="false" aria-controls="stage">
      <span aria-hidden="true">🎶</span> <span data-i18n="modeSongs">Lagu</span>
    </button>
    <button type="button" role="tab" class="mode" data-mode="echo" aria-selected="false" aria-controls="stage">
      <span aria-hidden="true">👂</span> <span data-i18n="modeEcho">Tiru</span>
    </button>
  </nav>

  <main class="stage" id="stage" role="tabpanel">
    <section class="panel" id="panelFree">
      <p class="readout" id="readout" aria-live="polite">
        <span class="read-num" id="readNum"></span>
        <span class="read-sol" id="readSol"></span>
        <span class="read-color" id="readColor"></span>
      </p>
    </section>

    <section class="panel" id="panelSongs" hidden>
      <div class="songs" id="songs" role="group" data-i18n-label="songs"></div>
      <div class="score" id="score" aria-hidden="true"></div>
      <p class="status" id="songStatus" aria-live="polite"></p>
    </section>

    <section class="panel" id="panelEcho" hidden>
      <p class="status" id="echoStatus" aria-live="polite"></p>
      <div class="score score--echo" id="echoDots" aria-hidden="true"></div>
      <p class="best" id="echoBest"></p>
    </section>

    <div class="actions" id="actions" hidden>
      <button type="button" class="action" id="btnListen">
        <span aria-hidden="true">🔈</span> <span data-i18n="listen">Dengar</span>
      </button>
      <button type="button" class="action" id="btnRestart">
        <span aria-hidden="true">↺</span> <span data-i18n="restart">Ulangi</span>
      </button>
    </div>
  </main>

  <div class="kolintang" id="kolintang" role="group" data-i18n-label="bars"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="../shared/kids/kids.js"></script>
<script src="../color-fusion/js/mix.js"></script>
<script src="js/kolintang.js"></script>
<script src="js/app.js"></script>
</body>
</html>
