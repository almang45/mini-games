<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Kartu Memori</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<script src="../shared/register-sw.js" defer></script>
<link rel="stylesheet" href="../shared/kids/kids.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back-link" href="../index.html" data-i18n="back">← Semua Game</a>
    <h1 data-i18n="title">Kartu Memori</h1>
    <div class="toggles">
      <div class="lang" role="group" data-i18n-label="language">
        <button type="button" class="lang-btn" data-lang="id" aria-pressed="true">ID</button>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="icon-btn" id="btnSound" aria-pressed="true" data-i18n-label="sound">
        <span aria-hidden="true" id="soundIcon">🔊</span>
      </button>
    </div>
  </header>

  <div class="controls">
    <nav class="modes" role="tablist" data-i18n-label="themes">
      <button type="button" role="tab" class="mode" data-theme="colors" aria-selected="true" aria-controls="board">
        <span aria-hidden="true">🎨</span> <span data-i18n="themeColors">Warna</span>
      </button>
      <button type="button" role="tab" class="mode" data-theme="animals" aria-selected="false" aria-controls="board">
        <span aria-hidden="true">🐾</span> <span data-i18n="themeAnimals">Hewan</span>
      </button>
      <button type="button" role="tab" class="mode" data-theme="numbers" aria-selected="false" aria-controls="board">
        <span aria-hidden="true">🔢</span> <span data-i18n="themeNumbers">Angka</span>
      </button>
    </nav>
    <div class="steps sizes" id="sizes" role="group" data-i18n-label="sizes"></div>
  </div>

  <main class="board" id="board" role="tabpanel">
    <div class="cards" id="cards"></div>
  </main>

  <div class="status">
    <p class="found" id="found" aria-live="polite"></p>
    <button type="button" class="action action--go" id="btnAgain" hidden data-i18n="again">Main lagi</button>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="../shared/kids/kids.js"></script>
<script src="../color-fusion/js/mix.js"></script>
<script src="js/memory.js"></script>
<script src="js/app.js"></script>
</body>
</html>
