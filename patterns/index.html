<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Lanjutkan Pola</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<script src="../shared/register-sw.js" defer></script>
<link rel="stylesheet" href="../shared/kids/kids.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back-link" href="../index.html" data-i18n="back">← Semua Game</a>
    <h1 data-i18n="title">Lanjutkan Pola</h1>
    <div class="toggles">
      <div class="lang" role="group" data-i18n-label="language">
        <button type="button" class="lang-btn" data-lang="id" aria-pressed="true">ID</button>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="icon-btn" id="btnSound" aria-pressed="true" data-i18n-label="sound">
        <span aria-hidden="true" id="soundIcon">🔊</span>
      </button>
    </div>
  </header>

  <nav class="steps" id="levels" data-i18n-label="levels"></nav>

  <main class="board">
    <p class="prompt" data-i18n="prompt">Apa selanjutnya?</p>
    <div class="string" id="string" role="img"></div>
    <div class="rounds" id="rounds" aria-hidden="true"></div>
    <div class="actions">
      <button type="button" class="action" id="btnListen">
        <span aria-hidden="true">🔈</span> <span data-i18n="listen">Dengar</span>
      </button>
    </div>
  </main>

  <div class="tray" id="tray" role="group" data-i18n-label="tray"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="../shared/kids/kids.js"></script>
<script src="../color-fusion/js/mix.js"></script>
<script src="../shared/kids/random.js"></script>
<script src="js/patterns.js"></script>
<script src="js/app.js"></script>
</body>
</html>
